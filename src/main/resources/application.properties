# Application name
spring.application.name=${SPRING_APPLICATION_NAME:vpnservice}

# Server port
server.port=${SERVER_PORT:6040}

# Logging
logging.level.com.strangequark=${LOGGING_LEVEL:INFO}
service.http.connect.timeout=${SERVICE_HTTP_CONNECT_TIMEOUT:5000}
service.http.read.timeout=${SERVICE_HTTP_READ_TIMEOUT:10000}

# DB config
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# Hibernate/JPA
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL:true}
spring.jpa.database=${SPRING_JPA_DATABASE:postgresql}
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}

# CORS origins
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:6080}

# Auth integration
authservice.integration=${AUTHSERVICE_INTEGRATION}
JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY}
JWT_ISSUER=${JWT_ISSUER}

# WireGuard
wireguard.control.url=${WIREGUARD_CONTROL_URL:http://wireguard:51821}
wireguard.control.token=${WIREGUARD_CONTROL_TOKEN}
vpn.endpoint=${VPN_HOST}:${VPN_PORT:51820}
vpn.client.dns=${VPN_CLIENT_DNS}
vpn.client.allowed-ips=${VPN_CLIENT_ALLOWED_IPS}
vpn.address.prefix=${VPN_ADDRESS_PREFIX:10.8.0}

# Encryption
ENCRYPTION_KEY=${ENCRYPTION_KEY}
